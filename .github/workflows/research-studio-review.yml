name: Research Studio review
on:
  push:
    branches: [feat/research-studio]
permissions:
  contents: read
concurrency:
  group: research-studio-review
  cancel-in-progress: true
jobs:
  source:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEW_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact branch head
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
      - name: Package exact public source for isolated review
        run: |
          git rev-parse HEAD > REVIEW-COMMIT.txt
          git archive --format=zip HEAD -o source.zip
          sha256sum source.zip
  checks:
    if: github.event.repository.private == false
    name: ${{ matrix.suite }} checks
    strategy:
      fail-fast: false
      matrix:
        suite: [core, journal, studio, account, tap, motion, consolidation, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      REVIEW_HEAD_SHA: ${{ github.sha }}
      npm_config_update_notifier: 'false'
    steps:
      - name: Check out the exact review head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the tested commit
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned account browser bundle
        run: npm run build:account && git diff --exit-code -- vendor/supabase.js
      - name: Install Chromium and WebKit
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run Node regressions
        if: matrix.suite == 'core'
        run: npm test
      - name: Run existing browser regressions
        if: matrix.suite == 'core'
        run: node scripts/ci-core.cjs core
      - name: Verify private Research Check-in and backup workflows
        if: matrix.suite == 'journal'
        run: npm run test:checkin && npm run test:backup
      - name: Verify Research Studio in Chromium and WebKit
        if: matrix.suite == 'studio'
        env:
          STUDIO_LOG_EVIDENCE: '1'
        run: npm run test:studio
      - name: Verify optional accounts and reviewed sync
        if: matrix.suite == 'account'
        env:
          ACCOUNT_LOG_EVIDENCE: '1'
        run: npm run test:account
      - name: Verify accessible Lumi interactions
        if: matrix.suite == 'tap'
        run: node scripts/ci-core.cjs tap
      - name: Verify Lumi motion
        if: matrix.suite == 'motion'
        run: node scripts/ci-core.cjs motion
      - name: Verify comparison and consolidation in Chromium and WebKit
        if: matrix.suite == 'consolidation'
        run: node test/consolidation.cjs && node test/consolidation-browser.cjs
      - name: Verify source-isolated public visuals and original evidence tools
        if: matrix.suite == 'evidence'
        run: |
          node test/research-evidence.cjs
          node test/sec-research.cjs
          node test/evidence-shell.cjs
          node test/research-evidence-browser.cjs
          node scripts/evidence-shell.cjs test-results/evidence-review
      - name: Record the evidence commit
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/REVIEW-COMMIT.txt
          cat test-results/REVIEW-COMMIT.txt
# FREE-only review: standard public runners. Test files and screenshots stay on the
# ephemeral runner. No artifact/cache uploads; no deployment or provider requests.
