name: Review browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: strikequests-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixture-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'review/research-guidance-provenance' || github.head_ref == 'fix/lumi-visible-motion' || github.head_ref == 'feat/lumi-contextual-guides' || github.head_ref == 'feat/lumi-tap-reactions' || github.head_ref == 'feat/research-checkin')
    name: ${{ matrix.suite }} checks
    strategy:
      fail-fast: false
      matrix:
        suite: [research, tap, motion]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      npm_config_update_notifier: 'false'
    steps:
      - name: Check out the exact review head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify the tested commit
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
      - name: Install pinned test dependencies
        id: dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install Chromium and WebKit
        id: chromium
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run Node regression suites
        if: matrix.suite == 'research'
        run: npm test
      - name: Run fixture-only browser suites
        if: matrix.suite == 'research'
        run: npm run test:browser
      - name: Verify Research Check-ins in mobile Chromium and WebKit
        if: ${{ always() && matrix.suite == 'research' && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:checkin
      - name: Verify accessible artwork taps and finite motion in Chromium and WebKit
        if: ${{ always() && matrix.suite == 'tap' && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:tap
      - name: Verify actual Chromium and WebKit motion over time
        if: ${{ always() && matrix.suite == 'motion' && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:motion
      - name: Emit bounded fixture screenshots to logs
        if: ${{ always() && matrix.suite == 'research' && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/review-evidence.cjs

  lumi-evolution:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/lumi-baby-evolution'
    name: Lumi evolution verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check original art, controller, earned badges and app-shell cache
        run: |
          node test/mascot-assets.cjs
          node test/mascot-controller.cjs
          node test/badge-migration.cjs
          node test/service-worker.cjs
      - name: Verify composed app in Chromium and WebKit
        run: node test/lumi-evolution-browser.cjs


  reflection-reward:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/checkin-reflection-reward'
    name: Research reflection reward verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check reflection rules and preserved journal, XP and Lumi data
        run: |
          node test/reflection-reward.cjs
          node test/research-checkin.cjs
          node test/badge-migration.cjs
          node test/mascot-assets.cjs
          node test/mascot-controller.cjs
          node test/service-worker.cjs
      - name: Verify completed reflections in Chromium and WebKit
        run: node test/reflection-reward-browser.cjs
      - name: Verify original Lumi collection and next-only evolution
        run: node test/lumi-evolution-browser.cjs

  research-layout:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/research-scenario-order'
    name: Research layout verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check existing calculation, storage, journal and companion rules
        run: |
          node test/regressions.cjs
          node test/shared-regressions.cjs
          node test/service-worker.cjs
          node test/badge-migration.cjs
          node test/mascot-assets.cjs
          node test/mascot-controller.cjs
          node test/research-checkin.cjs
          node test/reflection-reward.cjs
      - name: Report unchanged legacy fixture failures against released source
        run: node test/legacy-layout-baseline.cjs
      - name: Compare released and proposed Research layouts with synthetic fixtures
        run: node test/research-layout-browser.cjs
      - name: Verify completed reflections and original Lumi evolution
        run: |
          node test/reflection-reward-browser.cjs
          node test/lumi-evolution-browser.cjs

  symbol-discovery:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/research-symbol-discovery'
    name: Symbol discovery verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check calculation, data requests, journal and companion rules
        run: |
          node test/regressions.cjs
          node test/shared-regressions.cjs
          node test/service-worker.cjs
          node test/badge-migration.cjs
          node test/mascot-assets.cjs
          node test/mascot-controller.cjs
          node test/research-checkin.cjs
          node test/reflection-reward.cjs
      - name: Compare existing legacy fixture failures with released source
        run: node test/legacy-layout-baseline.cjs
      - name: Diagnose released search and verify local combobox, Quick Picks and cache upgrade
        run: node test/symbol-search-browser.cjs
      - name: Verify scenario appearance, reflections and Lumi evolution remain intact
        run: |
          node test/research-layout-browser.cjs
          node test/reflection-reward-browser.cjs
          node test/lumi-evolution-browser.cjs


  eod-connection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/eod-readiness-reconnect'
    name: EOD frontend connection verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Reproduce released race and verify connection lifetime and failures
        run: |
          node test/eod-connection-baseline.cjs
          node test/eod-connection.cjs
      - name: Verify calculations, cache, journal, rewards and Lumi
        run: |
          node test/regressions.cjs
          node test/shared-regressions.cjs
          node test/service-worker.cjs
          node test/badge-migration.cjs
          node test/research-checkin.cjs
          node test/reflection-reward.cjs
          node test/mascot-assets.cjs
          node test/mascot-controller.cjs
      - name: Verify connection races, error UI and cache upgrade in both engines
        run: node test/eod-connection-browser.cjs
      - name: Verify reflection and Lumi behavior remains intact
        run: |
          node test/reflection-reward-browser.cjs
          node test/lumi-evolution-browser.cjs
