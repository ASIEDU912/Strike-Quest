name: Quest production verification
on:
  push:
    branches: [feat/research-studio]
    paths: ['scripts/quest-production-*.cjs', '.github/workflows/quest-production.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ASIEDU912/Strike-Quest' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/quest-production-audit.cjs
# Read-only source and current-public health audit. No quote requests, provider
# quota, stored artifacts, paid runners, deployment, credentials or ref writes.
