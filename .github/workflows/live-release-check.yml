name: Verify live public release
on:
  push:
    branches: [verify/evidence-release-2026-10-14]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify exact published bytes and actual XLK TradingView chart with storage isolation
        run: node test/live-release-check.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_COMMIT: c93002aeef7c352458ebce441bd630154fb33dd0
          EXPECTED_SOURCE_COMMIT: 8ca926420c2cfb93fda31eecbe8556a576192b53
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-verification
          path: test-results/live-release/
          retention-days: 7
